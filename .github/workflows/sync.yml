name: 自动同步源仓库

on:
  schedule:
    # 北京时间每日 04:00 执行（UTC 20:00），错开其他工作流
    - cron: "0 20 * * *"
  workflow_dispatch:

concurrency:
  group: tvbox-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 拉取源仓库最新代码
        run: |
          git remote add source https://github.com/lubin776/tvbox-api-backup.git
          git fetch --depth=1 source main
          echo "源仓库最新提交: $(git log source/main -1 --format='%h %s')"

      - name: 用源仓库内容覆盖（保留本仓库聚合产出与自有 workflow）
        run: |
          # 排除项说明：
          #   .github/workflows  -> 保留本仓库自己的工作流定义
          #   tvbox/ list.txt    -> apidownload / livedownload 的产出
          #   livelist.txt       -> livedownload 的产出
          #   ry/                -> rydownload 的产出
          # 除上述聚合产出外，其余静态文件（api_list.json、apilinks.txt、
          # config.json、index.html、python/ 等）均按源站镜像覆盖。
          git checkout source/main -- . \
            ':(exclude).github/workflows' \
            ':(exclude)tvbox' \
            ':(exclude)list.txt' \
            ':(exclude)livelist.txt' \
            ':(exclude)ry'
          git add -A
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "✅ 源仓库无新变更，跳过提交" >> $GITHUB_STEP_SUMMARY
          else
            git commit -m "chore: 自动同步源仓库 [$(TZ='CST-8' date +'%Y-%m-%d %H:%M')]"
            # 不再使用 || true 吞掉 rebase 错误；若仍冲突会如实失败便于排查
            git pull --rebase --autostash origin main
            git push
            echo "✅ 已同步源仓库至 $(git log source/main -1 --format='%h')" >> $GITHUB_STEP_SUMMARY
          fi
