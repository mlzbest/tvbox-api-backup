name: 自动同步源仓库

on:
  schedule:
    # 北京时间每日 03:00 执行（UTC 19:00）
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 添加源仓库远程
        run: |
          git remote add source https://github.com/lubin776/tvbox-api-backup.git

      - name: 拉取源仓库最新代码
        run: |
          git fetch source main
          echo "源仓库最新提交: $(git log source/main -1 --format='%h %s')"

      - name: 同步文件（保留本仓库的 .github/workflows/sync.yml）
        run: |
          # 排除 sync.yml 和 _src，只同步其他文件
          git read-tree --prefix=sync-tmp/ -u source/main
          git checkout --track -B source-main source/main
          # 恢复本仓库的 sync.yml
          git checkout HEAD -- .github/workflows/sync.yml 2>/dev/null || true
          # 删除 _src submodule 目录
          rm -rf _src
          git rm -rf _src --ignore-unmatch 2>/dev/null || true
          # 提交所有变更
          git add -A
          git commit -m "chore: 自动同步源仓库 [$(TZ='CST-8' date +'%Y-%m-%d %H:%M'))]" || echo "无变更"
          git push
